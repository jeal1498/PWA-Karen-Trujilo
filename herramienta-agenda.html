<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Póster - Alineación Perfecta 9:16</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        serif: ['Georgia', 'Cambria', 'Times New Roman', 'Times', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Evita que cualquier desbordamiento horizontal desplace la página completa en móvil */
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        /* Proporción exacta 9:16 para Estados de WhatsApp e Historias de Instagram */
        .story-aspect {
            aspect-ratio: 9 / 16;
            width: 100%;
            max-width: 380px;
            min-width: 0;
        }

        /* Degradado de fondo exacto */
        .poster-bg-custom {
            background: radial-gradient(circle at 80% 20%, #2a3a2a 0%, #151e15 65%, #0f160f 100%);
        }

        /* Formato numérico consistente */
        .time-pill {
            font-variant-numeric: tabular-nums;
        }

        /* Scrollbar interno discreto */
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-emerald-600 selection:text-white">

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- VISTA PREVIA DEL PÓSTER 9:16 -->
        <section class="lg:col-span-7 flex flex-col items-center justify-start">
            
            <div class="w-full max-w-sm bg-slate-900/80 rounded-2xl border border-slate-800 overflow-hidden shadow-xl p-4 space-y-3">
                <div class="border-b border-slate-800 pb-2 flex items-center justify-center">
                    <span class="text-xs sm:text-sm font-bold text-white uppercase tracking-wider">
                        Vista Previa
                    </span>
                </div>

                <!-- CANVAS DEL PÓSTER 9:16 REAJUSTADO -->
                <div id="posterContainer" class="story-aspect rounded-2xl p-4 sm:p-4 flex flex-col justify-between transition-all duration-300 relative overflow-hidden shadow-2xl border border-slate-800 poster-bg-custom text-white font-serif">
                    
                    <!-- Elementos de Fondo (sin blur para compatibilidad) -->
                    <div class="absolute top-0 right-0 w-48 h-48 bg-emerald-600/15 rounded-full pointer-events-none"></div>
                    <div class="absolute -bottom-10 -left-10 w-52 h-52 bg-emerald-700/15 rounded-full pointer-events-none"></div>

                    <!-- Logo como marca de agua de fondo completo -->
                    <img src="Logo_Karen_Trujillo.webp" alt="" class="absolute inset-0 w-full h-full object-cover opacity-[0.08] pointer-events-none select-none" />

                    <!-- ENCABEZADO OPTIMIZADO -->
                    <div class="relative z-10 text-center space-y-0.5 pt-0">
                        <div class="space-y-0 pt-1 relative">
                            <h3 class="text-2xl sm:text-3xl font-bold tracking-wide text-emerald-200 leading-tight relative inline-block pt-1">
                                Karen Trujillo
                            </h3>
                            <p class="text-[11px] font-sans text-white font-medium leading-none pt-1">Neuropsicóloga</p>
                        </div>

                        <div class="flex items-center gap-2 my-2 px-2">
                            <div class="flex-1 h-px bg-emerald-200/30"></div>
                            <i class="fa-regular fa-calendar text-emerald-200/60 text-[10px]"></i>
                            <div class="flex-1 h-px bg-emerald-200/30"></div>
                        </div>

                        <div>
                            <h2 class="text-xs sm:text-sm font-bold tracking-wider font-sans uppercase text-white leading-none">CITAS DISPONIBLES</h2>
                            <p id="posterDynamicDate" class="text-[9.5px] italic text-emerald-100/90 opacity-90 leading-tight">Calculando fechas...</p>
                        </div>
                    </div>

                    <!-- CUERPO: 2 COLUMNAS, DOMINGO A ANCHO COMPLETO -->
                    <div id="posterSlotsGrid" class="relative z-10 my-1 flex flex-wrap overflow-hidden pr-0.5 min-w-0">
                        <!-- Generado dinámicamente -->
                    </div>

                    <!-- PIE DEL PÓSTER DENTRO DE LÍMITES -->
                    <div class="relative z-10 pt-1.5 border-t border-emerald-200/20 flex flex-col items-center text-center space-y-1 text-xs">
                        <p class="text-[8.5px] italic font-sans text-emerald-100/80 leading-none">
                            Sesiones de 50 min · Reserva por WhatsApp
                        </p>
                        <p class="text-[9px] font-bold font-sans text-white time-pill leading-none">
                            <i class="fa-brands fa-whatsapp text-emerald-300 text-[10px]"></i>
                            Contáctame: 998 321 1547
                        </p>
                    </div>

                </div>

            </div>

        </section>

        <!-- PANEL DE CONTROL -->
        <section class="lg:col-span-5 space-y-5">
            
            <!-- Horarios Sincronizados de la Semana -->
            <div class="bg-slate-900/80 rounded-2xl border border-slate-800 overflow-hidden shadow-xl p-4 space-y-3">
                <div class="border-b border-slate-800 pb-2 flex items-center justify-center gap-3 relative">
                    <button onclick="shiftWeek(-1)" class="w-6 h-6 flex items-center justify-center rounded-full text-emerald-400 hover:bg-slate-800 transition-colors" aria-label="Semana anterior">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <span class="text-xs sm:text-sm font-bold text-white uppercase tracking-wider">
                        Agenda Semanal
                    </span>
                    <button onclick="shiftWeek(1)" class="w-6 h-6 flex items-center justify-center rounded-full text-emerald-400 hover:bg-slate-800 transition-colors" aria-label="Semana siguiente">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                    <span id="syncBadge" class="absolute right-0 flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                </div>

                <!-- Lista de los 7 días para edición rápida -->
                <div id="slotsEditorList" class="flex gap-1.5">
                    <!-- Generado dinámicamente -->
                </div>
            </div>

        </section>

    </main>

    <!-- Toast de Notificaciones -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl border border-slate-800 flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage" class="text-sm font-medium">Notificación</span>
    </div>

    <!-- LÓGICA Y SINCRONIZACIÓN -->
    <script>
        const THERAPIST_PROFILE = {
            name: "Karen Trujillo",
            matricula: "Cédula profesional: 11009616",
            specialty: "Neuropsicóloga",
            modalidad: "Online & Presencial",
            whatsapp: "+52 998 321 1547"
        };

        let appState = {
            slots: []
        };

        window.onload = function() {
            document.getElementById('posterDynamicDate').innerText = getDynamic7DaysWeekString();
            triggerAutoSync();

            setInterval(() => {
                triggerAutoSync(true);
            }, 300000);
        };

        function getDynamic7DaysWeekString() {
            const now = new Date();
            const currentDay = now.getDay();
            const distanceToMonday = (currentDay === 0 ? -6 : 1) - currentDay;
            const monday = new Date(now);
            monday.setDate(now.getDate() + distanceToMonday + (weekOffset * 7));

            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            const startDay = monday.getDate();
            const endDay = sunday.getDate();

            const monthOptions = { month: 'long' };
            const month = sunday.toLocaleDateString('es-ES', monthOptions);

            return `Semana del ${startDay} al ${endDay} de ${month}`;
        }

        // Sincronizar los 7 días
        function triggerAutoSync(silent = false) {
            if (!silent) {
                showToast("Sincronizando citas desde Google Calendar...", "info");
            }

            setTimeout(() => {
                appState.slots = [
                    { id: 1, day: "Lunes", hours: ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"], active: true },
                    { id: 2, day: "Martes", hours: ["09:30", "10:30", "11:30", "12:30", "13:00", "14:00", "15:00", "16:00"], active: true },
                    { id: 3, day: "Miércoles", hours: ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"], active: true },
                    { id: 4, day: "Jueves", hours: ["09:00", "10:00", "10:30", "11:30", "13:00", "14:00", "15:00", "16:30"], active: true },
                    { id: 5, day: "Viernes", hours: ["09:30", "10:30", "11:30", "12:00", "13:00", "14:00", "15:30", "16:00"], active: true },
                    { id: 6, day: "Sábado", hours: ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"], active: true },
                    { id: 7, day: "Domingo", hours: ["10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00"], active: true }
                ];

                renderSlotsEditor();
                updatePoster();

                if (!silent) {
                    showToast("¡Citas reajustadas con éxito!");
                }
            }, 800);
        }

        let weekOffset = 0;

        function getWeekDates() {
            const now = new Date();
            const currentDay = now.getDay();
            const distanceToMonday = (currentDay === 0 ? -6 : 1) - currentDay;
            const monday = new Date(now);
            monday.setDate(now.getDate() + distanceToMonday + (weekOffset * 7));

            const dates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                dates.push(d);
            }
            return dates; // índice 0 = Lunes ... índice 6 = Domingo
        }

        function shiftWeek(delta) {
            weekOffset += delta;
            renderSlotsEditor();
            document.getElementById('posterDynamicDate').innerText = getDynamic7DaysWeekString();
        }

        function renderSlotsEditor() {
            const list = document.getElementById('slotsEditorList');
            list.innerHTML = '';

            const dayAbbrev = { "Domingo": "dom", "Lunes": "lun", "Martes": "mar", "Miércoles": "mié", "Jueves": "jue", "Viernes": "vie", "Sábado": "sáb" };
            const dayOrder = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
            const weekDates = getWeekDates();

            dayOrder.forEach((dayName, i) => {
                const slot = appState.slots.find(s => s.day === dayName);
                if (!slot) return;

                const item = document.createElement('div');
                item.className = "flex flex-col items-center flex-1 min-w-0";
                item.innerHTML = `
                    <div class="w-full bg-slate-900 rounded-t-2xl pt-2 pb-4 flex items-center justify-center">
                        <span class="text-white font-bold text-[10px] font-serif tracking-wide lowercase">${dayAbbrev[dayName]}</span>
                    </div>
                    <div class="w-full bg-slate-800 border-t border-slate-700 rounded-b-2xl -mt-3 pt-4 pb-2 flex items-center justify-center">
                        <span class="text-white font-bold text-lg font-serif tracking-wide">${weekDates[i].getDate()}</span>
                    </div>
                    <button onclick="editSlotHours(${slot.id})" class="mt-1.5 w-6 h-6 rounded-full bg-emerald-950 border border-emerald-800/60 flex items-center justify-center text-emerald-400 text-xs shadow">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                `;
                list.appendChild(item);
            });
        }

        function editSlotHours(id) {
            const slot = appState.slots.find(s => s.id === id);
            if (!slot) return;

            const newHours = prompt(`Editar horarios para ${slot.day}:`, slot.hours.join(', '));
            if (newHours !== null) {
                slot.hours = newHours.split(',').map(h => h.trim()).filter(h => h.length > 0);
                renderSlotsEditor();
                updatePoster();
            }
        }

        // Renderizado del Póster con proporciones exactas
        function updatePoster() {
            const grid = document.getElementById('posterSlotsGrid');
            grid.innerHTML = '';

            const activeSlots = appState.slots.filter(s => s.active);

            if (activeSlots.length === 0) {
                grid.innerHTML = `<p class="w-full text-center text-xs opacity-50 py-8">No hay días activados.</p>`;
                return;
            }

            // Cada día ocupa una columna (2 por fila); Domingo es la
            // excepción de ancho completo, centrado.
            let col = 0;

            activeSlots.forEach(slot => {
                const isSunday = slot.day.toLowerCase() === 'domingo';
                const card = document.createElement('div');

                if (isSunday) {
                    card.className = "w-full mb-2 min-w-0 p-2 rounded-lg border border-emerald-200/20 bg-emerald-950/45 flex flex-col justify-start space-y-1 font-sans";
                    col = 0;
                } else {
                    const isFirstColumn = col === 0;
                    card.className = `${isFirstColumn ? 'mr-[4%]' : ''} w-[48%] mb-2 min-w-0 p-2 rounded-lg border border-emerald-200/20 bg-emerald-950/45 flex flex-col justify-start space-y-1 font-sans`;
                    col = isFirstColumn ? 1 : 0;
                }

                let hoursHtml = "";
                if (slot.hours.length > 0) {
                    hoursHtml = slot.hours.map((h) => {
                        return `<div class="time-pill w-full py-0.5 px-1 rounded text-[8.5px] font-semibold border border-emerald-300/25 bg-emerald-900/60 text-emerald-100 font-sans leading-none text-center">${h}</div>`;
                    }).join('');
                } else {
                    hoursHtml = `<span class="text-[8px] italic opacity-40 text-center py-0.5 w-full">Sin citas disponibles</span>`;
                }

                const hoursContainerClass = isSunday ? "grid grid-cols-6 gap-x-1 gap-y-1.5 pt-0.5" : "grid grid-cols-3 gap-x-1 gap-y-1.5 pt-0.5";

                card.innerHTML = `
                    <div class="flex items-center justify-center border-b border-emerald-200/10 pb-0.5 px-0.5 min-w-0">
                        <span class="font-bold text-[10px] font-serif tracking-wide text-white leading-none truncate">${slot.day}</span>
                    </div>
                    <div class="${hoursContainerClass} min-w-0">${hoursHtml}</div>
                `;
                grid.appendChild(card);
            });

            // Quita el margen inferior de la última tarjeta para no dejar un
            // espacio de sobra al final del bloque (el "gap" original tampoco
            // añadía espacio después de la última fila).
            if (grid.lastElementChild) {
                grid.lastElementChild.classList.remove('mb-1.5');
            }
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.innerText = message;

            if (type === "info") {
                toastIcon.className = "fa-solid fa-spinner fa-spin text-emerald-400";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
