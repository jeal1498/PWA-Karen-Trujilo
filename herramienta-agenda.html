<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🗓️</text></svg>">
    <meta name="theme-color" content="#F9F7F2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
    <title>Póster - Alineación Perfecta 9:16</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tipografía consistente con index.html -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas: usado solo para la captura del póster -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        'eucalyptus-dark': '#2D3A32',
                        'eucalyptus-soft': '#5C7C69',
                        'silk-cream': '#F9F7F2',
                        'muted-gold': '#96715E',
                        'slate-warm': '#4A4E51'
                    },
                    fontFamily: {
                        sans: ['Nunito Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        serif: ['Libre Baskerville', 'Georgia', 'Cambria', 'Times New Roman', 'Times', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Evita que cualquier desbordamiento horizontal desplace la página completa en móvil */
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        /* El póster (#posterContainer) es 100% fijo en píxeles (1080x1920).
           #posterScaleWrapper solo lo escala visualmente con transform
           (calculado en JS); su alto se fija también en JS, sin usar
           aspect-ratio ni ninguna otra unidad relativa. */

        /* Scrollbar interno discreto */
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-silk-cream dark:bg-slate-950 text-eucalyptus-dark dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-emerald-600 selection:text-white">

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- VISTA PREVIA DEL PÓSTER 9:16 -->
        <section class="lg:col-span-7 flex flex-col items-center justify-start">

            <!-- Este wrapper solo ESCALA visualmente el póster para que quepa en
                 la pantalla (transform: scale). El póster en sí (#posterContainer)
                 tiene tamaño y posiciones 100% fijas en píxeles, sin nada
                 adaptativo/dinámico: es la misma estructura que se usa para la
                 captura final. -->
            <div id="posterScaleWrapper" class="w-full max-w-md" style="overflow:hidden; position:relative;">
                <div id="posterContainer" style="width:1080px; height:1920px; position:relative; overflow:hidden; transform-origin: top left; border-radius:24px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); border:3px solid rgba(150,113,94,0.3); background:#F3EEE0; color:#2D3A32;">
                    <!-- Generado dinámicamente por renderPosterContent() -->
                </div>
            </div>

            <button onclick="capturePoster()" class="mt-4 w-full max-w-md flex items-center justify-center gap-2 bg-eucalyptus-dark dark:bg-emerald-600 text-silk-cream font-sans font-semibold text-sm py-3 rounded-xl shadow-lg hover:opacity-90 active:scale-[0.98] transition">
                <i class="fa-solid fa-camera"></i>
                Capturar póster
            </button>

        </section>

        <!-- PANEL DE CONTROL -->
        <section class="lg:col-span-5 space-y-5">
            
            <!-- Horarios Sincronizados de la Semana -->
            <div class="bg-white/80 dark:bg-slate-900/80 rounded-2xl border border-muted-gold/20 dark:border-slate-800 overflow-hidden shadow-xl p-4 space-y-3">
                <div class="border-b border-muted-gold/20 dark:border-slate-800 pb-2 flex items-center justify-between gap-3">
                    <button onclick="shiftWeek(-1)" class="w-12 h-12 flex items-center justify-center rounded-full text-emerald-600 dark:text-emerald-400 hover:bg-silk-cream dark:hover:bg-slate-800 transition-colors" aria-label="Semana anterior">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <span class="text-xs sm:text-sm font-bold text-eucalyptus-dark dark:text-white uppercase tracking-wider">
                        Agenda Semanal
                    </span>
                    <button onclick="shiftWeek(1)" class="w-12 h-12 flex items-center justify-center rounded-full text-emerald-600 dark:text-emerald-400 hover:bg-silk-cream dark:hover:bg-slate-800 transition-colors" aria-label="Semana siguiente">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <div class="flex items-center justify-center gap-1.5">
                    <span id="syncBadge" class="relative flex h-2 w-2">
                      <span id="syncBadgePing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span id="syncBadgeDot" class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span id="syncStatusText" class="text-[9px] text-slate-warm dark:text-slate-400 font-sans"></span>
                </div>

                <details class="text-xs">
                    <summary class="cursor-pointer select-none text-slate-warm dark:text-slate-400 font-sans font-medium">¿Cómo funciona la agenda?</summary>
                    <div class="mt-2 space-y-2 text-slate-warm dark:text-slate-400 font-sans">
                        <p>Toca un <span class="font-bold text-eucalyptus-dark dark:text-white">día</span> para marcarlo como festivo, y toca una <span class="font-bold text-eucalyptus-dark dark:text-white">hora</span> para agregarla o quitarla del póster.</p>
                        <ul class="space-y-1 list-none">
                            <li><span class="inline-block w-2.5 h-2.5 rounded-sm bg-white border border-muted-gold/30 align-middle"></span> Libre</li>
                            <li><span class="inline-block w-2.5 h-2.5 rounded-sm bg-muted-gold align-middle"></span> Elegida (aparece en el póster)</li>
                            <li><span class="inline-block w-2.5 h-2.5 rounded-sm bg-rose-100 dark:bg-rose-950/60 border border-rose-300/70 dark:border-rose-800/50 align-middle"></span> Ocupada, no se puede tocar</li>
                        </ul>
                        <p>Límite: 8 horas por día, de 8 a.m. a 8 p.m.</p>
                    </div>
                </details>

                <!-- Vista semanal estilo Google Calendar -->
                <div id="slotsEditorList" class="-mx-1 px-1">
                    <!-- Generado dinámicamente -->
                </div>
            </div>

        </section>

    </main>

    <!-- Toast de Notificaciones -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white dark:bg-slate-900 text-eucalyptus-dark dark:text-white px-4 py-3 rounded-2xl shadow-2xl border border-muted-gold/20 dark:border-slate-800 flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage" class="text-sm font-medium">Notificación</span>
    </div>

    <!-- LÓGICA Y SINCRONIZACIÓN -->
    <script>
        const THERAPIST_PROFILE = {
            name: "Karen Trujillo",
            matricula: "Cédula profesional: 11009616",
            specialty: "Neuropsicóloga",
            modalidad: "Online & Presencial",
            whatsapp: "+52 998 321 1547"
        };

        // Plantilla base editable (horario habitual de Karen). Se persiste en
        // localStorage para no perderse en cada sincronización; solo se usa el
        // valor por defecto la primera vez que se abre la herramienta.
        const SCHEDULE_TEMPLATE_KEY = 'karen_schedule_template';

        const DEFAULT_SCHEDULE_TEMPLATE = [
            { id: 1, day: "Lunes", hours: [], active: true },
            { id: 2, day: "Martes", hours: [], active: true },
            { id: 3, day: "Miércoles", hours: [], active: true },
            { id: 4, day: "Jueves", hours: [], active: true },
            { id: 5, day: "Viernes", hours: [], active: true },
            { id: 6, day: "Sábado", hours: [], active: true }
        ];

        function loadScheduleTemplate() {
            try {
                const saved = localStorage.getItem(SCHEDULE_TEMPLATE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {
                console.error('No se pudo leer la plantilla guardada, usando la de por defecto.', e);
            }
            return JSON.parse(JSON.stringify(DEFAULT_SCHEDULE_TEMPLATE));
        }

        function saveScheduleTemplate() {
            try {
                localStorage.setItem(SCHEDULE_TEMPLATE_KEY, JSON.stringify(appState.slots));
            } catch (e) {
                console.error('No se pudo guardar la plantilla de horarios.', e);
            }
        }

        // ---- Reglas de agenda ----
        const APPOINTMENT_DURATION_MINUTES = 50; // duración de cada sesión
        const BUFFER_MINUTES = 10;                // colchón antes/después de cada cita
        const MIN_LEAD_MINUTES = 120;              // no mostrar horas con menos de 2h de aviso
        const EARLIEST_HOUR = 8;                   // Karen no atiende antes de las 8 a.m.
        const LATEST_HOUR = 19;                    // última hora de inicio de cita (7 p.m. a 8 p.m., cierre a las 8 p.m.)
        const MAX_SELECTED_HOURS_PER_DAY = 8;      // tope de horas elegidas a mano por día para el póster
        const BLOCKED_DATES_KEY = 'karen_blocked_dates'; // días festivos/bloqueados manualmente

        function dateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function loadBlockedDates() {
            try {
                const saved = localStorage.getItem(BLOCKED_DATES_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {
                console.error('No se pudieron leer los días bloqueados.', e);
            }
            return [];
        }

        function saveBlockedDates(dates) {
            try {
                localStorage.setItem(BLOCKED_DATES_KEY, JSON.stringify(dates));
            } catch (e) {
                console.error('No se pudieron guardar los días bloqueados.', e);
            }
        }

        function isDateBlocked(date) {
            return appState.blockedDates.includes(dateKey(date));
        }

        function toggleDayBlocked(date) {
            const key = dateKey(date);
            if (appState.blockedDates.includes(key)) {
                appState.blockedDates = appState.blockedDates.filter(k => k !== key);
            } else {
                appState.blockedDates.push(key);
            }
            saveBlockedDates(appState.blockedDates);
            renderSlotsEditor();
            updatePoster();
        }

        // ¿La hora choca con un evento ya agendado en Calendar? Se aplica el
        // buffer antes/después de cada cita para no dejarlas pegadas.
        function isHourBusy(dayDate, hourStr, busyEvents) {
            const [h, m] = hourStr.split(':').map(Number);
            const slotStart = new Date(dayDate);
            slotStart.setHours(h, m, 0, 0);
            const slotEnd = new Date(slotStart.getTime() + APPOINTMENT_DURATION_MINUTES * 60000);

            const bufferedStart = new Date(slotStart.getTime() - BUFFER_MINUTES * 60000);
            const bufferedEnd = new Date(slotEnd.getTime() + BUFFER_MINUTES * 60000);

            return busyEvents.some(ev => {
                const evStart = new Date(ev.start);
                const evEnd = new Date(ev.end);
                return bufferedStart < evEnd && bufferedEnd > evStart;
            });
        }

        const HOUR_LIST = Array.from({ length: LATEST_HOUR - EARLIEST_HOUR + 1 }, (_, i) => `${String(EARLIEST_HOUR + i).padStart(2, '0')}:00`);

        // Cuenta cuántas horas del día ya están ocupadas por citas reales de
        // Calendar, para sumarlas al tope de 8 horas laborales por día.
        function countBusyHoursForDate(dayDate) {
            return HOUR_LIST.filter(h => isHourBusy(dayDate, h, appState.busyEvents)).length;
        }

        // ¿Falta menos del mínimo de anticipación permitido?
        function isBeforeMinLeadTime(dayDate, hourStr) {            const [h, m] = hourStr.split(':').map(Number);
            const slotStart = new Date(dayDate);
            slotStart.setHours(h, m, 0, 0);
            const minAllowed = new Date(Date.now() + MIN_LEAD_MINUTES * 60000);
            return slotStart < minAllowed;
        }

        // Calcula, para el póster, los horarios realmente disponibles de la
        // semana visible: parte de la plantilla base y descarta días
        // bloqueados manualmente, horas ya ocupadas en Calendar (con buffer)
        // y horas por debajo de la anticipación mínima.
        function getAvailablePosterSlots() {
            const dayOrder = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            const weekDates = getWeekDates();

            return appState.slots
                .filter(slot => slot.active)
                .map(slot => {
                    const dateIndex = dayOrder.indexOf(slot.day);
                    const dayDate = dateIndex !== -1 ? weekDates[dateIndex] : null;

                    if (!dayDate || isDateBlocked(dayDate)) {
                        return { ...slot, hours: [], blocked: !!dayDate && isDateBlocked(dayDate) };
                    }

                    const hours = slot.hours.filter(h =>
                        !isHourBusy(dayDate, h, appState.busyEvents) &&
                        !isBeforeMinLeadTime(dayDate, h)
                    );

                    return { ...slot, hours };
                });
        }

        let appState = {
            slots: [],
            busyEvents: [], // eventos ya agendados en Google Calendar para la semana visible
            blockedDates: loadBlockedDates(),
            lastSyncAt: null,
            lastSyncOk: true,
            consecutiveFailures: 0
        };

        // Si hoy es domingo, la semana laboral (Lun-Sáb) actual ya terminó;
        // por default se muestra la semana siguiente.
        let weekOffset = (new Date().getDay() === 0) ? 1 : 0;

        function getWeekDates() {
            const now = new Date();
            const currentDay = now.getDay();
            const distanceToMonday = (currentDay === 0 ? -6 : 1) - currentDay;
            const monday = new Date(now);
            monday.setDate(now.getDate() + distanceToMonday + (weekOffset * 7));

            const dates = [];
            for (let i = 0; i < 6; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                dates.push(d);
            }
            return dates; // índice 0 = Lunes ... índice 5 = Sábado
        }

        // Rango Lunes 00:00 - Sábado 23:59 de la semana visible (según weekOffset).
        function getVisibleWeekRange() {
            const dates = getWeekDates();
            const start = new Date(dates[0]);
            start.setHours(EARLIEST_HOUR, 0, 0, 0);
            const end = new Date(dates[dates.length - 1]);
            end.setHours(LATEST_HOUR, 0, 0, 0);
            return { start, end };
        }

        // Filtro de seguridad: descarta cualquier evento de Calendar que no
        // toque la jornada laboral (8am-8pm) de su propio día, aunque el
        // endpoint llegara a devolver algo fuera de ese rango.
        function overlapsWorkday(ev) {
            const evStart = new Date(ev.start);
            const evEnd = new Date(ev.end);
            const workdayStart = new Date(evStart);
            workdayStart.setHours(EARLIEST_HOUR, 0, 0, 0);
            const workdayEnd = new Date(evStart);
            workdayEnd.setHours(LATEST_HOUR, 0, 0, 0);
            return evStart < workdayEnd && evEnd > workdayStart;
        }

        // Punto de conexión con el script real de Google Calendar. Debe
        // ---- Conexión con el endpoint de sincronización (api/busy-events.js en Vercel) ----
        // Pega aquí la URL del endpoint desplegado, ej:
        // https://tu-proyecto.vercel.app/api/busy-events
        // Mientras esté vacía, no se llama a Calendar y no se inventan datos.
        const CALENDAR_SYNC_WEBAPP_URL = 'https://tools-karen-trujilo.vercel.app/api/busy-events';

        window.CalendarSync = {
            async fetchBusyEvents(start, end) {
                if (!CALENDAR_SYNC_WEBAPP_URL) return [];

                const url = `${CALENDAR_SYNC_WEBAPP_URL}?start=${encodeURIComponent(start.toISOString())}&end=${encodeURIComponent(end.toISOString())}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Apps Script respondió ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }

                return data.busy || [];
            }
        };

        // devolver una promesa que resuelva con la lista de eventos ya
        // agendados dentro de [start, end]. Mientras no esté conectado el
        // script, devuelve un arreglo vacío (no bloquea ni inventa datos).
        async function fetchCalendarEvents(start, end) {
            if (window.CalendarSync && typeof window.CalendarSync.fetchBusyEvents === 'function') {
                return window.CalendarSync.fetchBusyEvents(start, end);
            }
            return [];
        }

        window.onload = function() {
            triggerAutoSync();

            setInterval(() => {
                triggerAutoSync(true);
            }, 300000);

            // Refresca el texto "hace X min" aunque no haya sync nueva
            setInterval(renderSyncStatus, 30000);
        };

        // Sincroniza los 6 días de la semana que se está viendo (weekOffset).
        // Recarga la plantilla base guardada por Karen y trae los eventos ya
        // ocupados de Calendar para ese rango. Si falla, NO se pisa el
        // último estado válido conocido.
        async function triggerAutoSync(silent = false) {
            if (!silent) {
                showToast("Sincronizando citas desde Google Calendar...", "info");
            }

            const { start, end } = getVisibleWeekRange();

            try {
                const [template, busyEvents] = await Promise.all([
                    Promise.resolve(loadScheduleTemplate()),
                    fetchCalendarEvents(start, end)
                ]);

                appState.slots = template;
                appState.busyEvents = busyEvents.filter(overlapsWorkday);
                appState.lastSyncAt = new Date();
                appState.lastSyncOk = true;
                appState.consecutiveFailures = 0;

                renderSlotsEditor();
                updatePoster();
                renderSyncStatus();

                if (!silent) {
                    showToast("¡Citas reajustadas con éxito!");
                }
            } catch (e) {
                console.error('Falló la sincronización con Calendar:', e);
                appState.lastSyncOk = false;
                appState.consecutiveFailures += 1;
                renderSyncStatus();

                if (!silent || appState.consecutiveFailures >= 3) {
                    showToast("No se pudo sincronizar con Calendar. Mostrando últimos datos guardados.", "error");
                }
            }
        }

        function formatRelativeTime(date) {
            if (!date) return 'sin sincronizar aún';
            const diffMs = Date.now() - new Date(date).getTime();
            const diffMin = Math.floor(diffMs / 60000);
            if (diffMin < 1) return 'justo ahora';
            if (diffMin < 60) return `hace ${diffMin} min`;
            const diffH = Math.floor(diffMin / 60);
            return `hace ${diffH} h`;
        }

        function renderSyncStatus() {
            const text = document.getElementById('syncStatusText');
            const dot = document.getElementById('syncBadgeDot');
            const ping = document.getElementById('syncBadgePing');
            if (!text || !dot || !ping) return;

            const failing = appState.consecutiveFailures >= 3;
            const warning = !appState.lastSyncOk && !failing;

            let color = 'bg-emerald-500';
            let pingColor = 'bg-emerald-400';
            let label = `Última sincronización: ${formatRelativeTime(appState.lastSyncAt)}`;

            if (failing) {
                color = 'bg-rose-500';
                pingColor = 'bg-rose-400';
                label = `Sin conexión con Calendar (${appState.consecutiveFailures} intentos fallidos) · últimos datos guardados`;
            } else if (warning) {
                color = 'bg-amber-500';
                pingColor = 'bg-amber-400';
                label = `Falló la última sincronización · últimos datos guardados`;
            }

            dot.className = `relative inline-flex rounded-full h-2 w-2 ${color}`;
            ping.className = `animate-ping absolute inline-flex h-full w-full rounded-full ${pingColor} opacity-75`;
            text.innerText = label;
        }

        function shiftWeek(delta) {
            weekOffset += delta;
            triggerAutoSync(true);
        }

        function formatHourParts(hourStr) {
            const h = parseInt(hourStr.split(':')[0], 10);
            const period = h < 12 ? 'AM' : 'PM';
            let hour12 = h % 12;
            if (hour12 === 0) hour12 = 12;
            return { num: String(hour12).padStart(2, '0'), period };
        }

        function formatHourLabel(hourStr) {
            const { num, period } = formatHourParts(hourStr);
            return `${num} ${period}`;
        }

        // Tocar una celda de hora libre la selecciona (o quita la selección) para
        // el póster. No aplica sobre horas ya ocupadas por una cita real
        // sincronizada de Calendar, ni si el día completo está marcado como
        // festivo. Máximo 8 horas laborales por día: suma las ya ocupadas en
        // Calendar más las elegidas a mano para el póster.
        function toggleHourActive(slotId, hour) {
            const slot = appState.slots.find(s => s.id === slotId);
            if (!slot) return;

            if (slot.hours.includes(hour)) {
                slot.hours = slot.hours.filter(h => h !== hour);
            } else {
                const dayOrder = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
                const dateIndex = dayOrder.indexOf(slot.day);
                const dayDate = dateIndex !== -1 ? getWeekDates()[dateIndex] : null;
                const busyHours = dayDate ? countBusyHoursForDate(dayDate) : 0;

                if (busyHours + slot.hours.length >= MAX_SELECTED_HOURS_PER_DAY) {
                    showToast(`${slot.day} ya llegó al máximo de ${MAX_SELECTED_HOURS_PER_DAY} horas laborales (incluye citas ya ocupadas)`, "error");
                    return;
                }
                slot.hours.push(hour);
                slot.hours.sort();
            }
            saveScheduleTemplate();
            renderSlotsEditor();
            updatePoster();
        }

        function renderSlotsEditor() {
            const list = document.getElementById('slotsEditorList');

            const dayAbbrev = { "Domingo": "dom", "Lunes": "lun", "Martes": "mar", "Miércoles": "mié", "Jueves": "jue", "Viernes": "vie", "Sábado": "sáb" };
            const dayOrder = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            const weekDates = getWeekDates();
            const todayRef = new Date();

            // Domingo no tiene slot (consultorio cerrado); se muestra solo como
            // columna de referencia, igual que en Google Calendar.
            const sundayDate = new Date(weekDates[0]);
            sundayDate.setDate(sundayDate.getDate() - 1);

            const columns = [{ name: "Domingo", date: sundayDate, slot: null }];
            dayOrder.forEach((dayName, i) => {
                columns.push({ name: dayName, date: weekDates[i], slot: appState.slots.find(s => s.day === dayName) || null });
            });

            // Grilla desde las 8 a.m. (hora más temprana en que Karen atiende) hasta
            // las 8 p.m.; no se muestran horas de madrugada.
            const hourList = HOUR_LIST;

            let html = `<div class="grid" style="grid-template-columns: 26px repeat(7, minmax(0, 1fr));">`;

            // Fila de encabezado: abreviatura + número de día (hoy va en círculo, como en Calendar).
            // Queda fija (sticky) arriba al hacer scroll vertical por las horas.
            html += `<div class="sticky top-0 z-10 bg-white/95 dark:bg-slate-900/95"></div>`;
            columns.forEach(col => {
                const isToday = col.date.getFullYear() === todayRef.getFullYear() && col.date.getMonth() === todayRef.getMonth() && col.date.getDate() === todayRef.getDate();
                const blocked = col.slot ? isDateBlocked(col.date) : false;
                const tapAttrs = col.slot ? `onclick="toggleDayBlocked(new Date(${col.date.getFullYear()}, ${col.date.getMonth()}, ${col.date.getDate()}))" role="button" tabindex="0" aria-label="${blocked ? 'Desbloquear' : 'Bloquear'} ${col.name}"` : '';
                html += `
                    <div class="sticky top-0 z-10 bg-white/95 dark:bg-slate-900/95 flex flex-col items-center justify-center gap-1 py-2 ${col.slot ? 'cursor-pointer' : ''}" ${tapAttrs}>
                        <span class="text-[9px] font-sans font-medium lowercase ${isToday ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-warm dark:text-slate-400'}">${dayAbbrev[col.name]}</span>
                        <span class="w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold font-serif ${isToday ? 'bg-eucalyptus-dark dark:bg-emerald-500 text-silk-cream' : 'text-eucalyptus-dark dark:text-white'} ${blocked ? 'line-through opacity-40' : ''}">${col.date.getDate()}</span>
                    </div>`;
            });

            // Filas de horas: cada celda = disponible / ocupada (por Calendar) / cerrada.
            // Tocar una celda disponible o cerrada prende/apaga esa hora; una hora ya
            // ocupada por una cita real, o un día festivo, no se puede tocar desde aquí.
            hourList.forEach(hour => {
                const { num, period } = formatHourParts(hour);
                html += `<div class="h-8 border-t border-muted-gold/10 dark:border-slate-800/50 relative">
                    <div class="absolute -top-2 left-0 right-0 flex flex-col items-center leading-none font-sans">
                        <span class="text-[9px] font-bold text-eucalyptus-dark dark:text-white">${num}</span>
                        <span class="text-[6.5px] tracking-wide text-slate-warm dark:text-slate-400">${period}</span>
                    </div>
                </div>`;
                columns.forEach(col => {
                    let status = 'closed';
                    if (col.slot) {
                        if (isDateBlocked(col.date)) status = 'blocked';
                        else if (isHourBusy(col.date, hour, appState.busyEvents)) status = 'busy';
                        else if (col.slot.hours.includes(hour)) status = 'selected';
                        else status = 'available';
                    }
                    const editable = col.slot && (status === 'available' || status === 'selected');
                    const cellClass = status === 'selected' ? 'bg-muted-gold border border-eucalyptus-dark/30 dark:border-silk-cream/30 flex items-center justify-center'
                        : status === 'busy' ? 'bg-rose-100 dark:bg-rose-950/60 border border-rose-300/70 dark:border-rose-800/50'
                        : status === 'blocked' ? 'bg-slate-100 dark:bg-slate-800/40'
                        : '';
                    const cellInner = status === 'selected' ? '<i class="fa-solid fa-check text-[9px] text-silk-cream"></i>' : '';
                    const tapAttrs = editable ? `onclick="toggleHourActive(${col.slot.id}, '${hour}')" role="button" tabindex="0" aria-label="${status === 'selected' ? 'Quitar del póster' : 'Agregar al póster'} ${dayAbbrev[col.name]} ${formatHourLabel(hour)}"` : '';
                    html += `<div class="h-8 border-t border-muted-gold/10 dark:border-slate-800/50 p-0.5 ${editable ? 'cursor-pointer' : ''}" ${tapAttrs}><div class="w-full h-full rounded-md ${cellClass}">${cellInner}</div></div>`;
                });
            });

            // Línea de cierre: marca el fin de la jornada (8 p.m.) sin ser una
            // hora agendable, igual que en Google Calendar.
            {
                const { num, period } = formatHourParts(`${LATEST_HOUR + 1}:00`);
                html += `<div class="h-3 border-t border-muted-gold/10 dark:border-slate-800/50 relative">
                    <div class="absolute -top-2 left-0 right-0 flex flex-col items-center leading-none font-sans">
                        <span class="text-[9px] font-bold text-eucalyptus-dark dark:text-white">${num}</span>
                        <span class="text-[6.5px] tracking-wide text-slate-warm dark:text-slate-400">${period}</span>
                    </div>
                </div>`;
                columns.forEach(() => {
                    html += `<div class="h-3 border-t border-muted-gold/10 dark:border-slate-800/50"></div>`;
                });
            }

            html += `</div>`;
            list.innerHTML = html;
        }

        // Construye el contenido del póster con tamaño y posiciones 100% fijas
        // en píxeles (lienzo de 1080x1920), sin flex/aspect-ratio/% ni nada
        // adaptativo. Se usa tal cual tanto para la vista previa en pantalla
        // (escalada solo visualmente por posterScaleWrapper) como para la
        // captura final, así ambas son siempre idénticas.
        function renderPosterContent(container, activeSlots) {
            container.innerHTML = '';
            container.style.fontFamily = "'Libre Baskerville', serif";

            const logo = document.createElement('img');
            logo.src = 'Logo_Karen_Trujillo.webp';
            logo.alt = '';
            logo.style.cssText = `position:absolute; top:0; left:0; width:1080px; height:1920px; object-fit:cover; opacity:0.06; pointer-events:none;`;
            container.appendChild(logo);

            const header = document.createElement('div');
            header.style.cssText = `position:absolute; top:90px; left:0; width:1080px; text-align:center;`;
            header.innerHTML = `
                <div style="font-family:'Libre Baskerville',serif; font-weight:700; font-size:88px; line-height:1;">Karen Trujillo</div>
                <div style="font-family:'Nunito Sans',sans-serif; font-weight:600; font-size:33px; color:#5C7C69; margin-top:16px;">Neuropsicóloga</div>
                <div style="display:flex; align-items:center; justify-content:center; gap:18px; margin:36px 120px 0;">
                    <div style="flex:1; height:3px; background:rgba(150,113,94,0.4);"></div>
                    <span style="font-size:30px; color:rgba(150,113,94,0.7);">&#128197;</span>
                    <div style="flex:1; height:3px; background:rgba(150,113,94,0.4);"></div>
                </div>
                <div style="font-family:'Nunito Sans',sans-serif; font-weight:700; font-size:36px; letter-spacing:2px; text-transform:uppercase; margin-top:30px;">Citas disponibles</div>
            `;
            container.appendChild(header);

            if (activeSlots.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = `position:absolute; top:800px; left:60px; width:960px; text-align:center; font-family:'Nunito Sans',sans-serif; font-size:30px; opacity:0.5;`;
                empty.textContent = 'No hay días activados.';
                container.appendChild(empty);
            }

            const positions = [
                { top: 450, left: 60 }, { top: 450, left: 556 },
                { top: 892, left: 60 }, { top: 892, left: 556 },
                { top: 1334, left: 60 }, { top: 1334, left: 556 }
            ];
            activeSlots.slice(0, 6).forEach((slot, i) => {
                const pos = positions[i];
                const card = document.createElement('div');
                card.style.cssText = `position:absolute; top:${pos.top}px; left:${pos.left}px; width:464px; height:406px; box-sizing:border-box; background:rgba(255,255,255,0.5); border:3px solid rgba(150,113,94,0.25); border-radius:24px; padding:10px 18px 18px; font-family:'Nunito Sans',sans-serif;`;

                let hoursHtml = "";
                if (slot.hours.length > 0) {
                    hoursHtml = slot.hours.map(h => `<div style="background:rgba(255,255,255,0.6); border:2px solid rgba(150,113,94,0.3); border-radius:12px; font-size:26px; font-weight:600; text-align:center; min-height:64px; display:flex; align-items:center; justify-content:center;">${h}</div>`).join('');
                } else {
                    hoursHtml = `<div style="grid-column:span 3; display:flex; align-items:center; justify-content:center; font-style:italic; opacity:0.4; font-size:24px; padding:20px 0;">${slot.blocked ? 'Día no disponible' : 'Sin citas disponibles'}</div>`;
                }

                card.innerHTML = `
                    <div style="text-align:center; border-bottom:2px solid rgba(150,113,94,0.2); padding-bottom:8px; margin-bottom:10px;">
                        <span style="font-family:'Libre Baskerville',serif; font-weight:700; font-size:30px; letter-spacing:0.5px;">${slot.day} ${slot.dayNumber}</span>
                    </div>
                    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;">${hoursHtml}</div>
                `;
                container.appendChild(card);
            });

            const footer = document.createElement('div');
            footer.style.cssText = `position:absolute; top:1780px; left:60px; width:960px; text-align:center; border-top:3px solid rgba(150,113,94,0.25); padding-top:24px;`;
            footer.innerHTML = `
                <div style="font-family:'Nunito Sans',sans-serif; font-style:italic; font-size:25px; color:#4A4E51;">Sesiones de 50 min · Reserva por WhatsApp</div>
                <div style="font-family:'Nunito Sans',sans-serif; font-weight:700; font-size:27px; margin-top:12px;">Contáctame: 998 321 1547</div>
            `;
            container.appendChild(footer);
        }

        // Arma la lista de slots activos con el número de día ya resuelto,
        // lista para pasar a renderPosterContent().
        function getPosterSlotsWithDayNumber() {
            const dayOrder = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            const weekDates = getWeekDates();
            return getAvailablePosterSlots().map(slot => {
                const dateIndex = dayOrder.indexOf(slot.day);
                return { ...slot, dayNumber: dateIndex !== -1 ? weekDates[dateIndex].getDate() : '' };
            });
        }

        // Escala visualmente #posterContainer (1080x1920 fijo) para que quepa
        // en el ancho disponible en pantalla. Es solo una transformación
        // visual (transform: scale): el contenido interno del póster no se
        // recalcula ni se adapta, siempre son los mismos 1080x1920 px.
        function updatePosterScale() {
            const wrapper = document.getElementById('posterScaleWrapper');
            const container = document.getElementById('posterContainer');
            if (!wrapper || !container) return;
            const scale = wrapper.clientWidth / 1080;
            container.style.transform = `scale(${scale})`;
            wrapper.style.height = `${1920 * scale}px`;
        }
        window.addEventListener('resize', updatePosterScale);

        // Renderizado del póster visible en pantalla.
        function updatePoster() {
            const container = document.getElementById('posterContainer');
            renderPosterContent(container, getPosterSlotsWithDayNumber());
            updatePosterScale();
        }

        // Captura el póster y lo descarga como PNG. Única función: generar y
        // guardar la imagen; no modifica datos. Arma una copia fuera de
        // pantalla con el mismo contenido fijo (sin la escala visual del
        // wrapper) para que html2canvas capture siempre a 1080x1920 exactos.
        function capturePoster() {
            showToast("Generando captura…", "info");

            const activeSlots = getPosterSlotsWithDayNumber();

            const runCapture = () => {
                const stage = document.createElement('div');
                stage.id = 'posterCaptureStage';
                stage.style.cssText = `position:fixed; left:-99999px; top:0; width:1080px; height:1920px; background:#F3EEE0; overflow:hidden; color:#2D3A32;`;
                document.body.appendChild(stage);
                renderPosterContent(stage, activeSlots);

                // Da tiempo a que el logo (imagen de fondo) termine de cargar.
                setTimeout(() => {
                    html2canvas(stage, {
                        scale: 1,
                        useCORS: true,
                        backgroundColor: '#F3EEE0',
                        width: 1080,
                        height: 1920
                    }).then(canvas => {
                        const link = document.createElement('a');
                        const fecha = new Date().toISOString().slice(0, 10);
                        link.download = `poster-karen-trujillo-${fecha}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        showToast("Captura descargada", "success");
                    }).catch(() => {
                        showToast("No se pudo generar la captura", "error");
                    }).finally(() => {
                        stage.remove();
                    });
                }, 150);
            };

            // Espera a que las fuentes web terminen de cargar antes de armar
            // el clon fijo y capturarlo.
            const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
            fontsReady.then(() => setTimeout(runCapture, 300));
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.innerText = message;

            if (type === "info") {
                toastIcon.className = "fa-solid fa-spinner fa-spin text-emerald-400";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
