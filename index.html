<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Portal de herramientas de la Psic. Karen Trujillo">
    <title>Karen Trujillo | Herramientas</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Karen Tools">
    <meta name="theme-color" content="#F2ECF2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#301E5B" media="(prefers-color-scheme: dark)">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #301E5B;
            --purple: #583C83;
            --purple-soft: #715F92;
            --lavender: #B09CC8;
            --light: #DFD4E1;
            --cream: #FAF8F8;
            --surface: #F2ECF2;
            --card: #FFFFFF;
            --text: #301E5B;
            --text-muted: #715F92;
            --border: rgba(138, 117, 167, 0.25);
            --shadow: 0 10px 30px rgba(48, 30, 91, 0.10);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #1E1240;
                --card: #301E5B;
                --text: #FAF8F8;
                --text-muted: #CDB0D6;
                --border: rgba(205, 176, 214, 0.25);
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            }
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; min-height: 100%; }

        body {
            font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--surface);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        }

        .hub {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .brand { text-align: center; }

        .brand-logo {
            width: 148px;
            height: 148px;
            border-radius: 50%;
            background: var(--cream);
            box-shadow: var(--shadow);
            object-fit: contain;
            padding: 10px;
        }

        .brand h1 {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 18px 0 4px;
        }

        .brand p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 20px;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-btn:hover { transform: translateY(-2px); }
        .menu-btn:active { transform: scale(0.98); }
        .menu-btn:focus-visible { outline: 3px solid var(--lavender); outline-offset: 3px; }

        .menu-icon {
            flex: 0 0 56px;
            height: 56px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--purple), var(--ink));
            color: var(--cream);
        }

        .menu-icon svg { width: 28px; height: 28px; }

        .menu-text { flex: 1; min-width: 0; }

        .menu-text strong {
            display: block;
            font-size: 1.08rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .menu-text span {
            display: block;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .menu-arrow { color: var(--text-muted); flex: 0 0 auto; }

        footer {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="hub">
        <header class="brand">
            <img class="brand-logo" src="/Logo_Karen_Trujillo.webp" alt="Logo Karen Trujillo" width="148" height="148">
            <h1>Karen Trujillo</h1>
            <p>Herramientas del consultorio</p>
        </header>

        <nav class="menu" aria-label="Módulos">
            <a class="menu-btn" href="/horarios/">
                <span class="menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/><circle cx="12" cy="15.5" r="2.5"/></svg>
                </span>
                <span class="menu-text">
                    <strong>Horarios de Atención</strong>
                    <span>Crea y comparte tu póster de disponibilidad</span>
                </span>
                <svg class="menu-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
            </a>

            <a class="menu-btn" href="/notas/">
                <span class="menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
                </span>
                <span class="menu-text">
                    <strong>Generar Nota de Remisión</strong>
                    <span>Emite, imprime o comparte en PDF</span>
                </span>
                <svg class="menu-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
            </a>
        </nav>

        <footer>Psic. Karen Trujillo · Neuropsicología</footer>
    </main>

    <script src="/pwa.js" defer></script>
</body>
</html>
